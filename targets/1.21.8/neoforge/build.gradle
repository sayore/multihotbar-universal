plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    runs {
        client { client(); gameDirectory.set(layout.projectDirectory.dir('run')) }
        server { server(); gameDirectory.set(layout.projectDirectory.dir('run-server')) }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements','runtimeElements','sourcesElements'].each { v ->
    configurations.named(v) { attributes { attribute(loaderAttribute, 'neoforge') } }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { v ->
        configurations.named(v) { attributes { attribute(loaderAttribute, 'neoforge') } }
    }
}
